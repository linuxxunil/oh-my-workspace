# 唯一入口（nginx:latest）。应用本地直跑时经 host.docker.internal 回调宿主。
# 端口说明：8000 被旧仓（oh-my-workspace）api 占用，本仓 dev 用 18081/18091 避让。
# /api/ -> FastAPI (uv run --project api, dev 端口 18081；注意 proxy_pass 末尾 / 做前缀剥离)
# / -> web (pnpm --filter workspace2-web dev / web 目录 pnpm dev, 5173)
# /sandbox/ -> sandbox 自建服务 (dev 端口 18091，按 S5 落地前 502)

upstream api_upstream {
  server host.docker.internal:18081;
}

upstream web_upstream {
  server host.docker.internal:5173;
}

upstream sandbox_upstream {
  server host.docker.internal:18091;
}

server {
  listen 80;
  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://api_upstream/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /sandbox/ {
    proxy_pass http://sandbox_upstream/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }

  location / {
    proxy_pass http://web_upstream;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
