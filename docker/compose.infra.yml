name: oh-my-workspace2

# S1 Infra：仅本地已有镜像，不 build 应用镜像。
# 应用（api/web/sandbox）开发期本地直跑：uv run --project api / pnpm dev。
# 本文件只起 postgres(+pgvector) / redis / nginx。
# 本地镜像依据：pgvector/pgvector:pg15, redis:6-alpine, nginx:latest（docker images 已核验）。

services:
  postgres:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - workspace2-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:6-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - workspace2-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nginx:
    image: nginx:latest
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "${NGINX_PORT:-18080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # 入口健康=反代链路健康（容器内 curl 可用已核验）；直跑 api 熄火时此处如实 unhealthy。
      test: ["CMD-SHELL", "curl -f http://localhost/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  workspace2-postgres-data:
  workspace2-redis-data:
